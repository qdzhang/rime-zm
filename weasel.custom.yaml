patch:
  "style/font_face": "Microsoft YaHei, Segoe UI Emoji, MiSans L3"
  "style/layout/border_width": 1
  "style/color_scheme": fcitx3
  preset_color_schemes:
    dark-teal:
      name: dark-teal
      author: Kang
      back_color: 0xEDEDED
      border_color: 0x825C1A
      text_color: 0x825C1A
      hilited_text_color: 0x825C1A
      hilited_back_color: 0xEDEDED
      hilited_candidate_text_color: 0xFFFFFF
      hilited_candidate_back_color: 0x825C1A
      candidate_text_color: 0x825C1A
      comment_text_color: 0x000000
    apathy:
      name: 冷漠／Apathy
      author: LIANG Hai
      candidate_format: "%c\u2005%@\u2005"  # 编号 %c 和候选词 %@ 前后的空间
      corner_radius: 5  #候选条圆角
      border_color: 0xEE6E00
      back_color: 0xFFFFFF  #候选条背景色
      text_color: 0x424242  #高亮选中词颜色
      hilited_candidate_text_color: 0xEE6E00  #候选文字颜色
      hilited_candidate_back_color: 0xFFF0E4  #候选文字背景色
      comment_text_color: 0x999999  #拼音等提示文字颜色
    fcitx3: # Generated by https://info-studio.github.io/rime-style/
      name: 'fcitx3'
      author: 'Larry'
      color_format: 'rgba'
      text_color: 0x7071feff
      label_color: 0xcc1615ff
      comment_text_color: 0x6565feff
      border_color: 0x5aa05aff
      shadow_color: 0x0000006e
      back_color: 0xf0fff0ff
      candidate_text_color: 0x000000ff
      candidate_border_color: 0x00000000
      candidate_back_color: 0x00000000
      candidate_shadow_color: 0x00000000
      hilited_text_color: 0x7071feff
      hilited_label_color: 0xcc1615ff
      hilited_mark_color: 0x00000000
      hilited_comment_text_color: 0x0a9a6aff
      hilited_back_color: 0x00000000
      hilited_shadow_color: 0x00000000
      hilited_candidate_text_color: 0x0a9a6aff
      hilited_candidate_border_color: 0x00000000
      hilited_candidate_back_color: 0x00000000
      hilited_candidate_shadow_color: 0x00000000
      prevpage_color: 0x00000000
      nextpage_color: 0x00000000